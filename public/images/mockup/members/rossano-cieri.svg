<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" preserveAspectRatio="xMidYMid slice"><defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f1a08"/><stop offset="1" stop-color="#050505"/></linearGradient>
      <radialGradient id="spot" cx="0.3" cy="0.32" r="0.55"><stop offset="0" stop-color="#facc15" stop-opacity="0.55"/><stop offset="0.6" stop-color="#facc15" stop-opacity="0.08"/><stop offset="1" stop-color="#facc15" stop-opacity="0"/></radialGradient>
