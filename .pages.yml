# Configurazione di Pages CMS (https://pagescms.org)
# Definisce il pannello con cui si modificano i contenuti del sito senza toccare il codice.

media:
  input: public/images
  output: /images
  categories: [image]

content:
  # ------------------------------------------------------------------ Tour
  - name: tour
    label: Date del tour
    type: file
    path: content/tour.json
    format: json
    list: true
    fields:
      - name: date
        label: Data del concerto
        type: date
        required: true
        description: Le date già passate spariscono da sole dal sito.
        options:
          format: yyyy-MM-dd
      - name: doorsTime
        label: Apertura porte
        type: string
        required: true
        description: Formato 24 ore, es. 21:30
        pattern:
          regex: "^([01]\\d|2[0-3]):[0-5]\\d$"
          message: Usa il formato ore:minuti, es. 21:30
      - name: venue
        label: Locale o festival
        type: string
        required: true
      - name: city
        label: Città
        type: string
        required: true
      - name: province
        label: Provincia (sigla)
        type: string
        required: true
        description: Due lettere, es. MI
        pattern:
          regex: "^[A-Za-z]{2}$"
          message: Usa la sigla di due lettere, es. MI
      - name: status
        label: Stato
        type: select
        required: true
        options:
          values:
            - name: AVAILABLE
              label: Biglietti disponibili
            - name: CONFIRMED
              label: Confermata (prevendite in arrivo)
            - name: SOLD_OUT
              label: Sold out
      - name: ticketUrl
        label: Link biglietti
        type: string
        description: Facoltativo. Mostrato solo se lo stato è "Biglietti disponibili". Deve iniziare con https://
        pattern:
          regex: "^(https?://\\S+)?$"
          message: Il link deve iniziare con https://
      - name: note
        label: Nota
        type: string
        description: Facoltativa, es. Halloween Night

  # ------------------------------------------------------------------ Band
  - name: band
    label: Band e contatti
    type: file
    path: content/band.json
    format: json
    fields:
      - name: name
        label: Nome band
        type: string
        required: true
      - name: tagline
        label: Sottotitolo
        type: string
        required: true
      - name: slogan
        label: Slogan
        type: text
        required: true
      - name: shortBio
        label: Bio breve (Hero)
        type: text
        required: true
      - name: manifesto
        label: Manifesto (un paragrafo per riquadro)
        type: text
        required: true
        list: true
      - name: contactEmail
        label: Email per il booking
        type: string
        required: true
        pattern:
          regex: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          message: Inserisci un indirizzo email valido
      - name: responseTime
        label: Tempo di risposta
        type: string
        required: true
        description: Es. 48 ore lavorative
      - name: baseCity
        label: Città di base
        type: string
        required: true
      - name: foundedYear
        label: Anno di fondazione
        type: number
        required: true
      - name: seoDescription
        label: Descrizione per Google
        type: text
        required: true
        description: Circa 150-160 caratteri. È il testo che appare nei risultati di ricerca.
      - name: members
        label: Line-up
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {role}"
        fields:
          - name: name
            label: Nome e cognome
            type: string
            required: true
          - name: role
            label: Ruolo
            type: string
            required: true
            description: Es. Basso, Chitarra, Batteria, Cantante
          - name: photo
            label: Foto
            type: image
            required: true
            description: Foto verticale (proporzione 4:5, es. 800×1000 px)
      - name: stats
        label: Numeri chiave
        type: object
        list:
          max: 4
          collapsible:
            collapsed: true
            summary: "{value} {label}"
        fields:
          - name: value
            label: Numero
            type: string
            required: true
            description: Es. +150
          - name: label
            label: Etichetta
            type: string
            required: true
          - name: description
            label: Descrizione
            type: string
            required: true
      - name: socials
        label: Social
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{platform} · {handle}"
        fields:
          - name: platform
            label: Piattaforma
            type: select
            required: true
            options:
              values:
                - name: instagram
                  label: Instagram
                - name: facebook
                  label: Facebook
                - name: youtube
                  label: YouTube
          - name: handle
            label: Nome profilo
            type: string
            required: true
            description: Es. @thundra.band
          - name: href
            label: Link al profilo
            type: string
            required: true
            pattern:
              regex: "^https?://\\S+$"
              message: Il link deve iniziare con https://

  # --------------------------------------------------------------- Setlist
  - name: setlist
    label: Setlist
    type: file
    path: content/setlist.json
    format: json
    list: true
    fields:
      - name: title
        label: Titolo brano
        type: string
        required: true
      - name: album
        label: Album originale
        type: string
        required: true
        description: Scrivi il nome dell'album sempre allo stesso modo per raggruppare i brani.
      - name: year
        label: Anno dell'album
        type: number
        required: true
      - name: duration
        label: Durata
        type: string
        required: true
        description: Minuti:secondi, es. 4:52
        pattern:
          regex: "^\\d{1,2}:[0-5]\\d$"
          message: Usa il formato minuti:secondi, es. 4:52
      - name: tags
        label: Tag tecnici
        type: select
        options:
          multiple: true
          values:
            - name: OPENER
              label: Opener
            - name: CLOSER
              label: Closer
            - name: ENCORE
              label: Encore
            - name: SINGALONG
              label: Sing-along
            - name: EXTENDED_SOLO
              label: Extended solo
            - name: FX_CUE
              label: FX cue
            - name: BAGPIPES
              label: Cornamusa
            - name: LEGATO_INTRO
              label: Legato intro
            - name: SHUFFLE
              label: Shuffle
            - name: HIGH_TEMPO
              label: High tempo

  # ------------------------------------------------------------ Tech rider
  - name: tech-rider
    label: Tech rider
    type: file
    path: content/tech-rider.json
    format: json
    fields:
      - name: version
        label: Versione
        type: string
        required: true
      - name: updatedAt
        label: Data di aggiornamento
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Riepilogo (riquadri)
        type: object
        list:
          max: 4
        fields:
          - name: value
            label: Valore
            type: string
            required: true
          - name: label
            label: Etichetta
            type: string
            required: true
      - name: sections
        label: Sezioni
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Titolo
            type: string
            required: true
          - name: icon
            label: Icona
            type: select
            required: true
            options:
              values:
                - name: stage
                  label: Palco
                - name: power
                  label: Alimentazione
                - name: backline
                  label: Backline
                - name: foh
                  label: PA & FOH
                - name: monitor
                  label: Monitor
                - name: lights
                  label: Luci
          - name: items
            label: Voci
            type: object
            list: true
            fields:
              - name: label
                label: Voce
                type: string
                required: true
              - name: value
                label: Valore
                type: string
                required: true
      - name: inputList
        label: Input list (in ordine di canale)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Ch {index} · {source}"
        fields:
          - name: source
            label: Sorgente
            type: string
            required: true
          - name: microphone
            label: Microfono / DI
            type: string
            required: true
          - name: stand
            label: Asta
            type: string
      - name: notes
        label: Note
        type: text
        list: true

  # ------------------------------------------------------------- Testi
  - name: texts
    label: Testi del sito
    type: file
    path: content/texts.json
    format: json
    fields:
      - name: hero
        label: Hero (apertura)
        type: object
        fields:
          - { name: eyebrow, label: Occhiello, type: string, required: true }
          - { name: availability, label: Disponibilità booking, type: string, required: true }
          - { name: primaryCta, label: Pulsante principale, type: string, required: true }
          - { name: secondaryCta, label: Pulsante secondario, type: string, required: true }
          - { name: signalLabel, label: Etichetta del player, type: string, required: true }
          - { name: nextShowLabel, label: Etichetta prossimo show, type: string, required: true }
          - name: featuredSongTitle
            label: Brano in evidenza nel player
            type: string
            description: Titolo esatto di un brano della setlist.
      - name: sections
        label: Titoli delle sezioni
        type: object
        fields:
          - name: about
            label: Band
            type: object
            fields:
              - { name: navLabel, label: Voce nel menu, type: string, required: true }
              - { name: eyebrow, label: Occhiello, type: string, required: true }
              - { name: title, label: Titolo, type: string, required: true }
              - { name: description, label: Descrizione, type: text, required: true }
          - name: tour
            label: Tour
            type: object
            fields:
              - { name: navLabel, label: Voce nel menu, type: string, required: true }
              - { name: eyebrow, label: Occhiello, type: string, required: true }
              - { name: title, label: Titolo, type: string, required: true }
              - { name: description, label: Descrizione, type: text, required: true }
          - name: setlist
            label: Setlist
            type: object
            fields:
              - { name: navLabel, label: Voce nel menu, type: string, required: true }
              - { name: eyebrow, label: Occhiello, type: string, required: true }
              - { name: title, label: Titolo, type: string, required: true }
              - { name: description, label: Descrizione, type: text, required: true }
          - name: rider
            label: Tech rider
            type: object
            fields:
              - { name: navLabel, label: Voce nel menu, type: string, required: true }
              - { name: eyebrow, label: Occhiello, type: string, required: true }
              - { name: title, label: Titolo, type: string, required: true }
              - { name: description, label: Descrizione, type: text, required: true }
          - name: booking
            label: Booking
            type: object
            fields:
              - { name: navLabel, label: Voce nel menu, type: string, required: true }
              - { name: eyebrow, label: Occhiello, type: string, required: true }
              - { name: title, label: Titolo, type: string, required: true }
              - { name: description, label: Descrizione, type: text, required: true }
      - name: tourCta
        label: Box "La tua città non è in lista?"
        type: object
        fields:
          - { name: title, label: Titolo, type: string, required: true }
          - { name: description, label: Descrizione, type: text, required: true }
          - { name: action, label: Testo pulsante, type: string, required: true }
      - name: tourEmptyMessage
        label: Messaggio quando non ci sono date
        type: text
        required: true
      - name: booking
        label: Sezione booking
        type: object
        fields:
          - name: steps
            label: Passaggi
            type: object
            list:
              max: 4
            fields:
              - { name: title, label: Titolo, type: string, required: true }
              - { name: description, label: Descrizione, type: text, required: true }
          - { name: directContactLabel, label: Etichetta contatto diretto, type: string, required: true }
          - { name: note, label: Nota, type: text, required: true }
          - { name: privacyNote, label: Nota privacy, type: text, required: true }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: contactEyebrow, label: Occhiello contatti, type: string, required: true }
          - { name: disclaimer, label: Disclaimer, type: text, required: true }
      - name: images
        label: Immagini
        type: object
        fields:
          - name: liveStage
            label: Foto live (sezione Band)
            type: object
            fields:
              - name: photo
                label: Foto
                type: image
                required: true
                description: Orizzontale 16:9, es. 1600×900 px
              - { name: alt, label: Descrizione della foto (accessibilità), type: string, required: true }
              - { name: caption, label: Didascalia, type: string }
          - name: crowd
            label: Foto di sfondo del box tour
            type: object
            fields:
              - name: photo
                label: Foto
                type: image
                required: true
                description: Orizzontale 16:9, es. 1600×900 px
              - { name: alt, label: Descrizione della foto (accessibilità), type: string, required: true }
      - name: techRiderRequest
        label: Pulsante richiesta rider
        type: object
        fields:
          - { name: label, label: Testo pulsante, type: string, required: true }
          - { name: subject, label: Oggetto email, type: string, required: true }
